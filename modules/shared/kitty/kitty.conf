# General settings
font_family FiraCode Nerd Font Mono
font_size 12
adjust_line_height 0
adjust_column_width 0
disable_ligatures never

# Window layout
window_padding_width 4
hide_window_decorations no

# Show "◆ nav" in the tab bar while kitty nav mode is active
tab_bar_min_tabs 1
tab_title_template "{f'{fmt.fg.yellow}◆ nav {fmt.fg.tab}' if keyboard_mode == 'nav' else ''}{title}"
active_tab_title_template "{f'{fmt.fg.yellow}◆ nav {fmt.fg.tab}' if keyboard_mode == 'nav' else ''}{title}"
window_border_width 2pt
draw_minimal_borders no
draw_window_borders_for_single_window yes
window_margin_width 4 4
single_window_margin_width 4 4
active_border_color #fabd2f
inactive_border_color #665c54

# Color scheme
background #262626
foreground #D4D4D4
cursor #FFFFFF

# Other settings
enable_audio_bell no
update_check_interval 0
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Ensure kittens can find nvim and other Nix-managed binaries
exe_search_path /etc/profiles/per-user/william/bin
exe_search_path /run/current-system/sw/bin

# Terminal compatibility for SSH
term xterm-256color

# Wayland
linux_display_server wayland
# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Window splits
enabled_layouts splits

# Disable default tab navigation to avoid conflicts
map ctrl+shift+left no_op
map ctrl+shift+right no_op

# Vim-style kitty mode: Ctrl+Space to enter, then plain hjkl / w / etc., Esc to exit
# Pass Ctrl+Space through to nvim (cmp); use cmdline match since user vars are unreliable
map --new-mode nav kitty_mod+f1>n --on-unknown passthrough
map --when-focus-on cmdline:nvim ctrl+space no_op
map --when-focus-on var:in_editor ctrl+space no_op
map --when-focus-on "not cmdline:nvim not var:in_editor" ctrl+space combine : push_keyboard_mode nav : set_tab_title "" : set_colors --all background=#3a3520 active_border_color=#fabd2f inactive_border_color=#665c3a cursor=#fabd2f : set_background_opacity 0.85
map --mode nav h neighboring_window left
map --mode nav j neighboring_window down
map --mode nav k neighboring_window up
map --mode nav l neighboring_window right
map --mode nav n launch --location=hsplit --cwd=current
map --mode nav v launch --location=vsplit --cwd=current
map --mode nav w close_window
map --mode nav d new_tab_with_cwd
map --mode nav f move_window_forward
map --mode nav b move_window_backward
map --mode nav r start_resizing_window
map --mode nav 1 goto_tab 1
map --mode nav 2 goto_tab 2
map --mode nav 3 goto_tab 3
map --mode nav 4 goto_tab 4
map --mode nav 5 goto_tab 5
map --mode nav 6 goto_tab 6
map --mode nav 7 goto_tab 7
map --mode nav 8 goto_tab 8
map --mode nav 9 goto_tab 9
map --mode nav escape combine : pop_keyboard_mode : set_tab_title "" : set_colors --reset : set_background_opacity default
map --mode nav q combine : pop_keyboard_mode : set_tab_title "" : set_colors --reset : set_background_opacity default

# Kitty-scrollback: open scrollback in Neovim (visual mode, vim motions, search, yank)
map ctrl+shift+a kitten @kitty-scrollback-nvim@
# Browse scrollback from last command output only
map ctrl+shift+g kitten @kitty-scrollback-nvim@ --config ksb_builtin_last_cmd_output

# File hints: detect file paths in terminal output and open in nvim
map ctrl+shift+p kitten hints --type path --program "launch --type=overlay nvim"
# Open containing directory in yazi
map ctrl+shift+y kitten hints --type path --program "launch --type=overlay yazi"

background_opacity 0.7
dynamic_background_opacity yes

# Gruvbox Dark color scheme
# The basic colors
foreground              #ebdbb2
background              #282828
selection_foreground    #655b53
selection_background    #ebdbb2

# Cursor colors
cursor                  #8ec07c
cursor_text_color       #1d2021

# URL underline color when hovering with mouse
url_color               #d65d0e

# The basic 16 colors
# black
color0                  #282828
color8                  #928374

# red
color1                  #cc241d
color9                  #fb4934

# green
color2                  #98971a
color10                 #b8bb26

# yellow
color3                  #d79921
color11                 #fabd2f

# blue
color4                  #458588
color12                 #83a598

# magenta
color5                  #b16286
color13                 #d3869b

# cyan
color6                  #689d6a
color14                 #8ec07c

# white
color7                  #a89984
color15                 #ebdbb2
