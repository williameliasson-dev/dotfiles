# General settings
font_family FiraCode Nerd Font Mono
font_size 12
adjust_line_height 0
adjust_column_width 0
disable_ligatures never

# Window layout
window_padding_width 4
hide_window_decorations no

# Color scheme
background #262626
foreground #D4D4D4
cursor #FFFFFF

# Other settings
enable_audio_bell no
update_check_interval 0
allow_remote_control yes
listen_on unix:/tmp/kitty-{kitty_pid}

# Terminal compatibility for SSH
term xterm-256color

# Wayland
linux_display_server wayland

# Keybindings
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Window splits
enabled_layouts splits
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+minus launch --location=hsplit --cwd=current
map ctrl+shift+backslash launch --location=vsplit --cwd=current

# Disable default tab navigation to avoid conflicts
map ctrl+shift+left no_op
map ctrl+shift+right no_op

# Window navigation
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Window management
map ctrl+shift+w close_window
map ctrl+shift+f move_window_forward
map ctrl+shift+b move_window_backward
map ctrl+shift+r start_resizing_window

# Additional configuration
background_opacity 0.7
map ctrl+shift+d new_tab_with_cwd

# Tab jumping
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9

# Kitty-scrollback: open scrollback in Neovim (visual mode, vim motions, search, yank)
map ctrl+shift+a kitten @kitty-scrollback-nvim@
# Browse scrollback from last command output only
map ctrl+shift+g kitten @kitty-scrollback-nvim@ --config ksb_builtin_last_cmd_output

# File hints: detect file paths in terminal output and open in nvim
map ctrl+shift+p kitten hints --type path --program "launch --type=overlay nvim"
# Open containing directory in yazi
map ctrl+shift+y kitten hints --type path --program "launch --type=overlay yazi"

# Gruvbox Dark color scheme
# The basic colors
foreground              #ebdbb2
background              #282828
selection_foreground    #655b53
selection_background    #ebdbb2

# Cursor colors
cursor                  #8ec07c
cursor_text_color       #1d2021

# URL underline color when hovering with mouse
url_color               #d65d0e

